databases:
  - name: adforge-db
    plan: free
    databaseName: adforge_db
    user: adforge_user

services:
  - type: web
    name: adforge-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx tsc
    startCommand: cd backend && npx prisma db push --skip-generate && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adforge-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: B2_APP_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET_ID
        sync: false
      - key: B2_BUCKET_NAME
        sync: false

version: '3.8'
services:
  db:
    image: postgres:15
    container_name: adforge_db
    environment:
      POSTGRES_USER: adforge
      POSTGRES_PASSWORD: adforgepassword
      POSTGRES_DB: adforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
